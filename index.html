<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quadro Semanal de Viagens</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --primary: #b91c1c;
      --primary-soft: rgba(185, 28, 28, 0.08);
      --primary-dark: #7f1d1d;
      --bg: #020617;
      --text: #0f172a;
      --muted: #6b7280;
      --border: rgba(148, 163, 184, 0.4);
      --surface: rgba(15, 23, 42, 0.88);
      --surface-soft: rgba(15, 23, 42, 0.75);
      --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.35);
      --radius-lg: 18px;
      --radius-md: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: #e5e7eb;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      background:
        radial-gradient(circle at top left, #1f2937 0, transparent 50%),
        radial-gradient(circle at bottom right, #7f1d1d 0, transparent 55%),
        linear-gradient(135deg, #020617 0%, #0b1120 60%, #111827 100%);
    }

    .shell {
      max-width: 1240px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 26px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #9ca3af;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(248, 250, 252, 0.06);
      border: 1px solid rgba(248, 250, 252, 0.1);
      color: #e5e7eb;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.1);
    }

    .topbar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .topbar h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #f9fafb;
    }

    .topbar p {
      font-size: 13px;
      color: #9ca3af;
      max-width: 520px;
    }

    .status-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      font-size: 11px;
      color: #9ca3af;
    }

    .status-label {
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
    }

    .status-value {
      font-weight: 500;
      color: #e5e7eb;
    }

    .status-tagline {
      font-size: 11px;
      color: #9ca3af;
    }

    /* GRADE EM 4 COLUNAS NO DESKTOP */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-top: 10px;
    }

    .card {
      position: relative;
      border-radius: var(--radius-lg);
      padding: 18px 18px 16px;
      background: linear-gradient(
          to bottom right,
          rgba(15, 23, 42, 0.96),
          rgba(15, 23, 42, 0.92)
        );
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(18px) saturate(170%);
      -webkit-backdrop-filter: blur(18px) saturate(170%);
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at top right,
        rgba(248, 250, 252, 0.1),
        transparent 55%
      );
      opacity: 0.7;
      pointer-events: none;
    }

    .card-inner {
      position: relative;
      z-index: 1;
    }

    .header-card {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .dia {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #e5e7eb;
    }

    .dia-label {
      font-size: 11px;
      font-weight: 500;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    .data {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    .data-text {
      font-size: 13px;
      font-weight: 500;
      color: #e5e7eb;
    }

    .data-chip {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      background: rgba(248, 250, 252, 0.06);
      border: 1px solid rgba(248, 250, 252, 0.12);
      color: #9ca3af;
    }

    .divider {
      height: 1px;
      border-radius: 999px;
      background: linear-gradient(
        to right,
        rgba(148, 163, 184, 0.0),
        rgba(148, 163, 184, 0.55),
        rgba(148, 163, 184, 0.0)
      );
      margin-bottom: 6px;
    }

    .viagens {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .viagem {
      border-radius: var(--radius-md);
      padding: 10px 10px 10px;
      background: linear-gradient(
        135deg,
        rgba(15, 23, 42, 0.98),
        rgba(15, 23, 42, 0.92)
      );
      border: 1px solid rgba(51, 65, 85, 0.7);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.55);
    }

    .viagem-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
      gap: 8px;
    }

    .viagem-title {
      font-size: 13px;
      font-weight: 600;
      color: #f9fafb;
      overflow-wrap: break-word;
    }

    .viagem-tag {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(248, 250, 252, 0.06);
      color: #9ca3af;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    .label-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      column-gap: 12px;
      row-gap: 8px;
      margin-top: 4px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
    }

    .valor {
      font-size: 13px;
      line-height: 1.4;
      padding: 7px 8px;
      border-radius: 8px;
      background: linear-gradient(
        to bottom right,
        rgba(15, 23, 42, 0.96),
        rgba(15, 23, 42, 0.9)
      );
      border: 1px solid rgba(55, 65, 81, 0.9);
      color: #e5e7eb;
      white-space: pre-line;
      overflow-wrap: break-word;
    }

    .valor.muted {
      color: #9ca3af;
      font-style: italic;
    }

    .maps-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
    }

    .maps-info {
      font-size: 11px;
      color: #9ca3af;
    }

    .maps-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #f9fafb;
      text-decoration: none;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid rgba(191, 219, 254, 0.6);
      box-shadow: 0 10px 22px rgba(37, 99, 235, 0.4);
      transition: transform 0.16s ease, box-shadow 0.16s ease,
        background 0.16s ease;
    }

    .maps-btn-icon {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: rgba(248, 250, 252, 0.12);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .maps-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.6);
      background: linear-gradient(135deg, #1d4ed8, #1d4ed8);
    }

    .footer {
      margin-top: 22px;
      text-align: right;
      font-size: 11px;
      color: #9ca3af;
      opacity: 0.9;
    }

    @media (max-width: 768px) {
      body {
        padding: 22px 16px;
      }

      .brand-row {
        flex-direction: column;
        align-items: flex-start;
      }

      .topbar-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .status-block {
        align-items: flex-start;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand-row">
        <div class="brand-left">
          <div class="brand-title">Quadro semanal</div>
        </div>
        <span class="badge">
          <span class="badge-dot"></span>
          Painel semanal de viagens
        </span>
      </div>

      <div class="topbar-header">
        <div class="title-block">
          <h1>Quadro Semanal de Viagens</h1>
          <p>
            Painel de acompanhamento das viagens planejadas e acompanhamentos SEOC/SEOE ao longo da semana.
          </p>
        </div>
        <div class="status-block">
          <div class="status-label">Status de atualização</div>
          <div id="ultimaAtualizacao" class="status-value">Atualizando...</div>
          <div class="status-tagline">
            Dados sincronizados automaticamente a cada 1 minuto
          </div>
        </div>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="footer">
      Quadro operacional de viagens
    </div>
  </div>

  <script>
    const URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vSynGA0A1qGU6W-zmf3t14OHv0LEcPEO5aIF2aIeWAwZB5GUz8qEVUvc2GMSIhEUm5Fj61vRnBA8Jou/pub?output=csv";

    async function carregarDados() {
      try {
        const resposta = await fetch(URL + "&t=" + new Date().getTime());
        const texto = await resposta.text();

        const linhas = texto.trim().split("\n");
        const dados = linhas.slice(1);
        const agrupados = {};

        dados.forEach((linha) => {
          const colunas = linha.split(",");

          const data = colunas[0]?.trim();
          if (!data) return;

          if (!agrupados[data]) {
            agrupados[data] = [];
          }

          agrupados[data].push({
            evento: colunas[1] || "-",
            seoc: colunas[2] || "-",
            seoe: colunas[3] || "-",
            local: colunas[4] || "-",
            obs: colunas[5] || "-",
          });
        });

        const diasSemana = [
          "Domingo",
          "Segunda-feira",
          "Terça-feira",
          "Quarta-feira",
          "Quinta-feira",
          "Sexta-feira",
          "Sábado",
        ];

        let html = "";

        Object.keys(agrupados).forEach((data) => {
          const partes = data.split("/");
          const dia = parseInt(partes[0]);
          const mes = parseInt(partes[1]) - 1;
          const ano = new Date().getFullYear();

          const dataObj = new Date(ano, mes, dia);
          const diaSemana = diasSemana[dataObj.getDay()];

          html += `
            <div class="card">
              <div class="card-inner">
                <div class="header-card">
                  <div>
                    <div class="dia-label">Dia da operação</div>
                    <div class="dia">${diaSemana}</div>
                  </div>
                  <div class="data">
                    <div class="data-text">${data}</div>
                    <div class="data-chip">Agenda do dia</div>
                  </div>
                </div>
                <div class="divider"></div>
                <div class="viagens">
          `;

          agrupados[data].forEach((item, index) => {
            const maps =
              "https://www.google.com/maps/search/?api=1&query=" +
              encodeURIComponent(item.local);

            html += `
              <div class="viagem">
                <div class="viagem-header">
                  <div class="viagem-title">
                    ${item.evento || "Atividade sem título"}
                  </div>
                  <div class="viagem-tag">Viagem ${index + 1}</div>
                </div>

                <div class="label-group">
                  <div class="field">
                    <div class="label">Acompanhamento SEOC</div>
                    <div class="valor ${
                      item.seoc === "-" ? "muted" : ""
                    }">${item.seoc}</div>
                  </div>

                  <div class="field">
                    <div class="label">Acompanhamento SEOE</div>
                    <div class="valor ${
                      item.seoe === "-" ? "muted" : ""
                    }">${item.seoe}</div>
                  </div>

                  <div class="field">
                    <div class="label">Destino da viagem</div>
                    <div class="valor ${
                      item.local === "-" ? "muted" : ""
                    }">${item.local}</div>
                  </div>
                </div>

                <div class="maps-row">
                  <span class="maps-info">
                    Visualizar localização no Google Maps
                  </span>
                  <a
                    class="maps-btn"
                    href="${maps}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    <span class="maps-btn-icon">▲</span>
                    Ver rota
                  </a>
                </div>

                <div class="field" style="margin-top: 10px;">
                  <div class="label">Observações</div>
                  <div class="valor ${
                    item.obs === "-" ? "muted" : ""
                  }">${item.obs}</div>
                </div>
              </div>
            `;
          });

          html += `
                </div>
              </div>
            </div>
          `;
        });

        document.getElementById("grid").innerHTML = html;

        const agora = new Date();
        document.getElementById("ultimaAtualizacao").innerText =
          agora.toLocaleDateString("pt-BR") +
          " · " +
          agora.toLocaleTimeString("pt-BR");
      } catch (erro) {
        console.error(erro);
        document.getElementById("grid").innerHTML =
          "<h2>Erro ao carregar planilha.</h2>";
      }
    }

    carregarDados();
    setInterval(carregarDados, 60000);
  </script>
</body>
</html>
