<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quadro Semanal de Viagens</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --primary: #b91c1c;
      --primary-soft: rgba(185, 28, 28, 0.08);
      --primary-dark: #7f1d1d;
      --bg: #020617;
      --text: #0f172a;
      --muted: #6b7280;
      --border: rgba(148, 163, 184, 0.4);
      --surface: rgba(15, 23, 42, 0.88);
      --surface-soft: rgba(15, 23, 42, 0.75);
      --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.35);
      --radius-lg: 18px;
      --radius-md: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: #e5e7eb;
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      background:
        radial-gradient(circle at top left, #1f2937 0, transparent 50%),
        radial-gradient(circle at bottom right, #7f1d1d 0, transparent 55%),
        linear-gradient(135deg, #020617 0%, #0b1120 60%, #111827 100%);
    }

    .shell {
      max-width: 1240px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #9ca3af;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: rgba(248, 250, 252, 0.06);
      border: 1px solid rgba(248, 250, 252, 0.1);
      color: #e5e7eb;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.1);
    }

    .topbar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .topbar h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #f9fafb;
    }

    .topbar p {
      font-size: 13px;
      color: #9ca3af;
      max-width: 520px;
    }

    .status-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      font-size: 11px;
      color: #9ca3af;
    }

    .status-label {
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
    }

    .status-value {
      font-weight: 500;
      color: #e5e7eb;
    }

    .status-tagline {
      font-size: 11px;
      color: #9ca3af;
    }

    .today-strip {
      margin-bottom: 14px;
      background: linear-gradient(
        to right,
        rgba(15, 23, 42, 0.98),
        rgba(15, 23, 42, 0.94)
      );
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.45);
      box-shadow: var(--shadow-soft);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .today-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .today-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #9ca3af;
      font-weight: 600;
    }

    .today-date {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #f9fafb;
    }

    .today-extra {
      font-size: 12px;
      color: #9ca3af;
    }

    .general-info {
      margin-bottom: 18px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .general-info .field {
      background: linear-gradient(
        to bottom right,
        rgba(15, 23, 42, 0.96),
        rgba(15, 23, 42, 0.9)
      );
      border-radius: var(--radius-lg);
      border: 1px solid rgba(148, 163, 184, 0.4);
      padding: 10px 12px;
      box-shadow: var(--shadow-soft);
    }

    .general-info .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    .general-info .valor {
      font-size: 14px;
      color: #e5e7eb;
      white-space: pre-line;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-top: 10px;
    }
